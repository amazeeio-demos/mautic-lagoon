x-volumes:
  &default-volumes
    volumes:
      - .:/app:delegated
      - files:/app/config

x-environment:
  &default-environment
    LAGOON_ROUTE: &default-url http://${COMPOSE_PROJECT_NAME:-mautic-drupal-ch}.docker.amazee.io
    PHP_MEMORY_LIMIT: 512M
    PHP_MAX_EXECUTION_TIME: 300
    PHP_UPLOAD_MAX_FILESIZE: 128M
    PHP_POST_MAX_SIZE: 128M
    PHP_OPCACHE_MEMORY_CONSUMPTION: 256
    PHP_OPCACHE_MAX_ACCELERATED_FILES: 20000
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: 0
    PHP_REALPATH_CACHE_SIZE: 4096K
    PHP_REALPATH_CACHE_TTL: 600
    MARIADB_HOST: mariadb
    MARIADB_PORT: "3306"
    MARIADB_DATABASE: mautic
    MARIADB_USERNAME: mautic
    MARIADB_PASSWORD: mautic
    MAUTIC_ALLOW_UNSUPPORTED_DB_VERSION: "true"
    # Uncomment if you like to have the system behave like in production
    #LAGOON_ENVIRONMENT_TYPE: production
    # Uncomment to enable xdebug and then restart via `docker-compose up -d`
    #XDEBUG_ENABLE: "true"

x-user:
  &default-user
    user: '1000'

volumes:
  files:
    {}
  db:
    {}

services:

  cli:
    build:
      context: .
      target: cli
      dockerfile: .lagoon/Dockerfile
    image: &cli-image ${COMPOSE_PROJECT_NAME:-mautic-drupal-ch}-cli
    labels:
      # Lagoon Labels
      lagoon.type: cli-persistent
      lagoon.persistent.name: nginx
      lagoon.persistent: /app/config/
      lando.type: php-cli-drupal
    << : *default-volumes
    user: root
    volumes_from:
      - container:amazeeio-ssh-agent
    environment:
      << : *default-environment

  nginx:
    build:
      context: .
      target: nginx
      dockerfile: .lagoon/Dockerfile
      args:
        CLI_IMAGE: *cli-image
    labels:
      lagoon.type: nginx-php-persistent
      lagoon.persistent: /app/config/
      lando.type: nginx-drupal
    ports:
      - "8080"
    << : [*default-volumes, *default-user]
    depends_on:
      - cli
    environment:
      << : *default-environment
      LAGOON_LOCALDEV_URL: *default-url
    networks:
      - amazeeio-network
      - default

  php:
    build:
      context: .
      target: php
      dockerfile: .lagoon/Dockerfile
      args:
        CLI_IMAGE: *cli-image
    labels:
      lagoon.type: nginx-php-persistent
      lagoon.name: nginx
      lagoon.persistent: /app/config/
      lando.type: php-fpm
    << : [*default-volumes]
    user: root
    depends_on:
      - cli
    environment:
      << : *default-environment

  mariadb:
    image: uselagoon/mariadb-10.11-drupal:latest
    labels:
      lagoon.type: mariadb
      lando.type: mariadb-drupal
    ports:
      - "3306"
    << : *default-user
    environment:
      << : *default-environment
      MARIADB_USER: mautic
      MARIADB_PASSWORD: mautic
      MARIADB_DATABASE: mautic
    volumes:
      - db:/var/lib/mysql

  # worker:
  #   build:
  #     context: .
  #     target: cli
  #     dockerfile: .lagoon/Dockerfile
  #   image: *cli-image
  #   labels:
  #     lagoon.type: cli-persistent
  #     lagoon.persistent: /app/config/
  #     lando.type: php-cli
  #   << : [*default-volumes, *default-user]
  #   depends_on:
  #     - cli
  #   environment:
  #     << : *default-environment

networks:
  amazeeio-network:
    external: true
